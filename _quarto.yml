project:
  type: website

lang: pl
website:
  title: "Miarodajnie - Piotr Urbański"
  description: "Przekładam język statystyki na proste wnioski o zjawiskach, które obserwujemy na co dzień."
  favicon: "images/favicon.webp"
  site-url: "https://piotr-urbanski.netlify.app"
  navbar:
    title: false
    search: true
    background: transparent
    logo: "images/logo_horizontal.webp"
    logo-alt: "Logo strony internetowej Miarodajnie"
    right:
    - text: Projekty
      menu:
      - "content/projects.qmd" 
      - "content/projects.qmd" 
    - text: Blog
      href: "content/blog-posts.qmd"
    - text: O mnie
      href: about.qmd
  page-footer:
    left: 
      - text: © 2026 Piotr Urbański
    center:
      - icon: linkedin
        href: https://linkedin.com/in/urbnski/
      - icon: github
        href: https://github.com/p-urbanski
      - icon: rss
        href: index.xml
      - icon: envelope-fill
        href: mailto:piotr_urbanski@o2.pl
    right: "Stworzono przy użyciu [Github](https://github.com/p-urbanski), [R](https://www.r-project.org/) oraz [Quarto](https://quarto.org/)"
    
format:
